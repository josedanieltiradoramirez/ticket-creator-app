<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Detail</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="ticket-page">

        <div class="ticket-header">
            <div>
                <label>Ticket Number</label>
                <input
                    type="text"
                    id="ticketNumber"
                >
                <input
                    type="text"
                    id="ticketTitle"
                >
            </div>
            <button id="saveButton">Save Changes</button>
            <button id="backButton">← Back</button>
            
        </div>


        <!-- USER -->

        <section class="ticket-section">

            <h2>User information</h2>

            <div class="ticket-grid">

                <div>
                    <label>User</label>
                    <input type="text" id="userName">
                </div>

                <div>
                    <label>Email</label>
                    <input type="email" id="userEmail">

                </div>

                <div>
                    <label>Phone</label>
                    <input type="text" id="userPhone">
                </div>

                <div>
                    <label>User Type</label>
                    <input type="text" id="userType">
                </div>

            </div>

        </section>


        <!-- ISSUE -->

        <section class="ticket-section">

            <h2>Issue</h2>

            <div class="ticket-grid">

                <div>
                    <label>Issue Type</label>
                    <select id="issueType"></select>
                </div>

                <div>
                    <label>Tool</label>
                    <select id="tool"></select>
                </div>

                <div>
                    <label>Location</label>
                    <select id="location"></select>
                </div>

                <div>
                    <label>Priority</label>
                    <select id="priority"></select>
                </div>

            </div>

            <div class="ticket-field">

                <label>Issue Description</label>

                <textarea id="issueDescription"></textarea>

            </div>

        </section>
        
        <!-- FORM -->
        <div>
            <label>Form</label>
            <select id="form"></select>
        </div>

        <div class="ticket-field">

            <label>Form Preview</label>

            <textarea
                id="formPreview"
                readonly
            ></textarea>

        </div>

        <div class="ticket-field">

            <button id="copyFormButton">
                Copy Form
            </button>

        </div>

        <div class="ticket-field">

            <label>Form</label>

            <textarea
                id="formContent"
                placeholder="Paste and complete the form here..."
            ></textarea>

        </div>

        <!-- TROUBLESHOOTING -->

        <div class="ticket-field">

            <label>Template</label>

            <select id="troubleshootingTemplate"></select>

        </div>

        <div class="ticket-field">

            <label>Template Preview</label>

            <textarea
                id="troubleshootingTemplatePreview"
                readonly
            ></textarea>

            <button type="button" id="copyTemplateButton">
                Copy
            </button>

        </div>

        <div class="ticket-field">

            <label>Troubleshooting Steps</label>

            <textarea id="troubleshootingSteps"></textarea>

        </div>

         <!-- Additional notes -->

        <div class="ticket-field">

            <label>Additional Notes</label>

            <textarea id="additionalNotes"></textarea>

        </div>


        <!-- Configuration -->

        <section class="ticket-section">

            <h2>Configuration</h2>

            <div class="ticket-grid">

                <div>
                    <label>Status</label>
                    <select id="status"></select>
                </div>

                <div>
                    <label>Queue</label>
                    <select id="queue"></select>
                </div>

                <div>
                    <label>KB Article</label>
                    <p id="knowledgeBase"></p>
                </div>

            </div>

        </section>


        <!-- DATES -->

        <section class="ticket-section">

            <h2>Información del ticket</h2>

            <div class="ticket-grid">

                <div>
                    <label>Created</label>
                    <p id="createdAt"></p>
                </div>

                <div>
                    <label>Updated</label>
                    <p id="updatedAt"></p>
                </div>

                <div>
                    <label>Closed</label>
                    <p id="closedAt"></p>
                </div>

            </div>

        </section>

    </div>


    <script src="js/api.js"></script>
    <script src="js/ticket-detail.js"></script>

</body>

</html>
