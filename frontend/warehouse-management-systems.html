<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WMS</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tools.css">
</head>

<body>

    <div class="page-container">

        <div class="crud-header">

            <h2>Warehouse Management Systems</h2>

            <div>

                <button id="backButton">
                    Back
                </button>

                <button id="newWmsButton">
                    + New WMS
                </button>

            </div>

        </div>


        <div class="crud-toolbar">

            <input
                type="text"
                id="searchWms"
                placeholder="Search WMS..."
            >

        </div>


        <div class="crud-table-container">

            <table class="crud-table">

                <thead>

                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody id="wmsTableBody">
                </tbody>

            </table>

        </div>

    </div>


    <!-- WMS MODAL -->

    <div
        id="wmsModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h3 id="modalTitle">
                    Create WMS
                </h3>

                <button
                    id="closeWmsModal"
                    class="modal-close"
                >
                    ×
                </button>

            </div>


            <form id="wmsForm">

                <div class="form-group">

                    <label for="wmsName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="wmsName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="wmsDescription">
                        Description
                    </label>

                    <textarea
                        id="wmsDescription"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelWmsButton"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        id="saveWmsButton"
                    >
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/warehouse-management-systems.js"></script>

</body>

</html>
