<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WMS Details</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/tools.css"
    >

</head>


<body>

    <div class="page-container">


        <!-- ================================================= -->
        <!-- HEADER -->
        <!-- ================================================= -->

        <div class="crud-header">

            <h2 id="wmsTitle">
                Warehouse Management System
            </h2>


            <div>

                <button
                    id="backButton"
                    type="button"
                >
                    Back
                </button>

            </div>

        </div>


        <!-- ================================================= -->
        <!-- BASIC INFORMATION -->
        <!-- ================================================= -->

        <div class="crud-table-container">

            <h3>
                Basic Information
            </h3>


            <form id="wmsDetailForm">


                <div class="form-group">

                    <label for="wmsName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="wmsName"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="wmsDescription">
                        Description
                    </label>

                    <textarea
                        id="wmsDescription"
                        rows="5"
                    ></textarea>

                </div>


                <div class="modal-actions">

                    <button
                        type="submit"
                        id="saveWmsButton"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>


        <!-- ================================================= -->
        <!-- RELATED LOCATIONS -->
        <!-- ================================================= -->

        <div class="crud-table-container">

            <div class="crud-header">

                <h3>
                    Related Locations
                </h3>


                <button
                    id="addLocationButton"
                    type="button"
                >
                    + Add Location
                </button>

            </div>


            <table class="crud-table">

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            City
                        </th>

                        <th>
                            State
                        </th>

                        <th>
                            Code
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Actions
                        </th>

                    </tr>

                </thead>


                <tbody id="locationsTableBody">
                </tbody>

            </table>


            <div
                id="emptyLocationsMessage"
                class="empty-message hidden"
            >
                No locations are associated with this WMS.
            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- ADD LOCATION MODAL -->
    <!-- ===================================================== -->

    <div
        id="locationModal"
        class="modal hidden"
    >

        <div class="modal-content">


            <div class="modal-header">

                <h3>
                    Add Location
                </h3>


                <button
                    id="closeLocationModal"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <div class="form-group">

                <label for="locationSelect">
                    Location
                </label>


                <select id="locationSelect">

                    <option value="">
                        Select a location
                    </option>

                </select>

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    id="cancelLocationButton"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    id="saveLocationButton"
                >
                    Add Location
                </button>

            </div>

        </div>

    </div>


    <script src="js/api.js"></script>

    <script src="js/warehouse-management-system-detail.js"></script>

</body>

</html>
