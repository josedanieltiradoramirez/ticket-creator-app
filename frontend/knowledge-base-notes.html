<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Knowledge Base Notes</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tools.css">
    <link rel="stylesheet" href="css/details/detail-header.css">
    <link rel="stylesheet" href="css/details/modal.css">
    <link rel="stylesheet" href="css/details/notifications.css">
    <link rel="stylesheet" href="css/list-page.css">
</head>

<body>
    <div id="appNavigation"></div>

    <div class="app-content">
        <main class="list-page-container">
            <div id="pageHeader"></div>

            <section class="list-page-section">
                <div class="list-page-toolbar">
                    <div class="list-page-search">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search Knowledge Base Notes..."
                            aria-label="Search Knowledge Base Notes"
                        >
                    </div>

                    <button
                        type="button"
                        id="addNoteButton"
                        class="list-page-create-button"
                    >
                        + Add Knowledge Base Note
                    </button>
                </div>

                <div
                    id="notesEmptyState"
                    class="list-page-empty-state list-page-hidden"
                >
                    <p class="list-page-empty-message">
                        No Knowledge Base Notes found.
                    </p>
                </div>

                <div class="list-page-table-container">
                    <table class="list-page-table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Status</th>
                                <th>Pinned</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="notesTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="noteModal" class="modal hidden"></div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/components/detail-header.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>
    <script src="js/knowledge-base-notes.js"></script>
</body>
</html>
