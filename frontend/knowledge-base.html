<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Knowledge Base</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tools.css">
    <link rel="stylesheet" href="css/details/detail-header.css">
    <link rel="stylesheet" href="css/details/modal.css">
    <link rel="stylesheet" href="css/details/notifications.css">
    <link rel="stylesheet" href="css/list-page.css">
</head>

<body>
    <div id="appNavigation"></div>

    <div class="app-content">
        <main class="list-page-container">
            <div id="pageHeader"></div>

            <section class="list-page-section">
                <div class="list-page-toolbar">
                    <div class="list-page-search">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search knowledge base..."
                            aria-label="Search knowledge base articles"
                        >
                    </div>

                    <button
                        type="button"
                        id="addKnowledgeBaseButton"
                        class="list-page-create-button"
                    >
                        + New Knowledge Base Article
                    </button>
                </div>

                <div
                    id="knowledgeBaseEmptyState"
                    class="list-page-empty-state list-page-hidden"
                >
                    <p class="list-page-empty-message">
                        No Knowledge Base articles found.
                    </p>
                </div>

                <div class="list-page-table-container">
                    <table class="list-page-table">
                        <thead>
                            <tr>
                                <th>Article Number</th>
                                <th>Title</th>
                                <th>URL</th>
                                <th>Description</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="knowledgeBaseTableBody"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="knowledgeBaseModal" class="modal hidden"></div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/components/detail-header.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>
    <script src="js/knowledge-base.js"></script>
</body>
</html>
