<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Knowledge Base</title>

    <link
        rel="stylesheet"
        href="css/tools.css"
    >

</head>

<body>

    <header>

        <h1>Knowledge Base</h1>

        <button id="backButton">
            Back
        </button>

    </header>


    <main>

        <div class="crud-header">

            <h2>Knowledge Base</h2>

            <button id="addKnowledgeBaseButton">
                New Knowledge Base Article
            </button>

        </div>


        <div class="crud-toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search knowledge base..."
            >

        </div>


        <div class="crud-table-container">

            <table class="crud-table">

                <thead>

                    <tr>

                        <th>Article Number</th>
                        <th>Title</th>
                        <th>URL</th>
                        <th>Description</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="knowledgeBaseTableBody">
                </tbody>

            </table>

        </div>

    </main>


    <!-- ================================================= -->
    <!-- CREATE / EDIT MODAL -->
    <!-- ================================================= -->

    <div
        id="knowledgeBaseModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    New Knowledge Base Article
                </h2>

                <button
                    id="closeModalButton"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="knowledgeBaseForm">


                <div class="form-group">

                    <label for="articleNumber">
                        Article Number
                    </label>

                    <input
                        type="text"
                        id="articleNumber"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="url">
                        URL
                    </label>

                    <input
                        type="url"
                        id="url"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="5"
                        required
                    ></textarea>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelButton"
                    >
                        Cancel
                    </button>

                    <button type="submit">
                        Save
                    </button>

                </div>


            </form>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/knowledge-base.js"></script>

</body>

</html>
