<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Location Details</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/tools.css"
    >
</head>

<body>

    <div class="page-container">

        <!-- HEADER -->
        <div class="crud-header">

            <h2 id="locationName">
                Location
            </h2>

            <div>

                <button
                    id="backButton"
                    type="button"
                >
                    Back
                </button>

                <button
                    id="editButton"
                    type="button"
                >
                    Edit
                </button>

            </div>

        </div>


        <!-- LOCATION INFORMATION -->
        <div class="crud-table-container">

            <h3>
                Basic Information
            </h3>


            <table class="crud-table">

                <tbody>

                    <tr>

                        <th>
                            Name
                        </th>

                        <td id="locationNameValue">
                        </td>

                    </tr>


                    <tr>

                        <th>
                            City
                        </th>

                        <td id="locationCity">
                        </td>

                    </tr>


                    <tr>

                        <th>
                            State
                        </th>

                        <td id="locationState">
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Code
                        </th>

                        <td id="locationCode">
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Status
                        </th>

                        <td id="locationStatus">
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Warehouse Management System
                        </th>

                        <td id="locationWms">
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Location ID
                        </th>

                        <td id="locationId">
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/location-detail.js"></script>

</body>

</html>
