<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Troubleshooting Templates</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tools.css">
    <link rel="stylesheet" href="css/details/detail-header.css">
    <link rel="stylesheet" href="css/details/modal.css">
    <link rel="stylesheet" href="css/details/notifications.css">
    <link rel="stylesheet" href="css/list-page.css">
    <link rel="stylesheet" href="css/design-system.css">
</head>

<body>
    <div id="appNavigation"></div>

    <div class="app-content">
        <main class="list-page-container">
            <div id="pageHeader"></div>

            <section class="list-page-section">
                <div class="list-page-toolbar">
                    <div class="list-page-search">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search troubleshooting templates..."
                            aria-label="Search troubleshooting templates"
                        >
                    </div>

                    <button
                        type="button"
                        id="addTemplateButton"
                        class="list-page-create-button"
                    >
                        + New Template
                    </button>
                </div>

                <div class="list-page-table-container">
                    <table class="list-page-table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Generated Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="templatesTableBody"></tbody>
                    </table>

                    <div
                        id="templatesEmptyState"
                        class="list-page-empty-state list-page-hidden"
                    >
                        <div class="list-page-empty-title">No Troubleshooting Templates found</div>
                        <div class="list-page-empty-description">There are no troubleshooting templates matching your search.</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="templateModal" class="modal hidden"></div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/components/detail-header.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>
    <script src="js/troubleshooting-templates.js"></script>
</body>
</html>
