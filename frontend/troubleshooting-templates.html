<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Troubleshooting Templates</title>

    <link
        rel="stylesheet"
        href="css/tools.css"
    >

</head>

<body>

    <header>

        <h1>Troubleshooting Templates</h1>

        <button id="backButton">
            Back
        </button>

    </header>


    <main>

        <div class="crud-header">

            <h2>Troubleshooting Templates</h2>

            <button id="addTemplateButton">
                New Template
            </button>

        </div>


        <div class="crud-toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search troubleshooting templates..."
            >

        </div>


        <div class="crud-table-container">

            <table class="crud-table">

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Generated Description</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="templatesTableBody">
                </tbody>

            </table>

        </div>

    </main>


    <!-- CREATE / EDIT MODAL -->

    <div
        id="templateModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    New Troubleshooting Template
                </h2>

                <button
                    id="closeModalButton"
                    class="modal-close"
                    type="button"
                >
                    ×
                </button>

            </div>


            <form id="templateForm">

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                    >

                </div>


                <div class="form-group">

                    <label for="generatedDescription">
                        Generated Description
                    </label>

                    <textarea
                        id="generatedDescription"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="steps">
                        Troubleshooting Steps
                    </label>

                    <textarea
                        id="steps"
                        rows="10"
                        required
                    ></textarea>

                </div>


                <div class="form-group checkbox-group">

                    <input
                        type="checkbox"
                        id="isActive"
                        checked
                    >

                    <label for="isActive">
                        Active
                    </label>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelButton"
                    >
                        Cancel
                    </button>

                    <button type="submit">
                        Save
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/troubleshooting-templates.js"></script>

</body>

</html>
