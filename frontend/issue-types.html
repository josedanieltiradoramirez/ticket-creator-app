<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Issue Types</title>


    <!-- ============================================================
         GLOBAL STYLES
    ============================================================ -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- ============================================================
         SHARED COMPONENT STYLES
    ============================================================ -->

    <link
        rel="stylesheet"
        href="css/details/detail-header.css"
    >

    <link
        rel="stylesheet"
        href="css/details/modal.css"
    >

    <link
        rel="stylesheet"
        href="css/details/notifications.css"
    >


    <!-- ============================================================
         LIST PAGE STYLES
    ============================================================ -->

    <link
        rel="stylesheet"
        href="css/list-page.css"
    >

</head>


<body>


    <!-- ============================================================
         NAVIGATION
    ============================================================ -->

    <div id="appNavigation"></div>


    <!-- ============================================================
         MAIN CONTENT
    ============================================================ -->

    <div class="app-content">

        <main>


            <!-- ====================================================
                 PAGE HEADER
            ==================================================== -->

            <div id="pageHeader"></div>


            <!-- ====================================================
                 LIST PAGE
            ==================================================== -->

            <section class="list-page-section">


                <!-- =================================================
                     TOOLBAR
                ================================================= -->

                <div class="list-page-toolbar">

                    <div class="list-page-search">

                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search issue types..."
                            autocomplete="off"
                        >

                    </div>


                    <button
                        type="button"
                        class="list-page-create-button"
                        id="addIssueTypeButton"
                    >
                        New Issue Type
                    </button>

                </div>


                <!-- =================================================
                     TABLE
                ================================================= -->

                <div class="list-page-table-container">

                    <table class="list-page-table">

                        <thead>

                            <tr>

                                <th>
                                    Name
                                </th>

                                <th>
                                    Category
                                </th>

                                <th>
                                    Display Name
                                </th>

                                <th>
                                    Form
                                </th>

                                <th>
                                    Status
                                </th>

                                <th class="list-page-actions-column">
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="issueTypesTableBody"
                        ></tbody>

                    </table>


                    <!-- =============================================
                         EMPTY STATE
                    ============================================== -->

                    <div
                        id="issueTypesEmptyState"
                        class="list-page-empty-state list-page-hidden"
                    >

                        <div class="list-page-empty-title">
                            No Issue Types found
                        </div>

                        <div class="list-page-empty-description">
                            There are no issue types matching your
                            search.
                        </div>

                    </div>

                </div>

            </section>

        </main>

    </div>


    <!-- ============================================================
         MODAL
    ============================================================ -->

    <div
        id="issueTypeModal"
        class="modal hidden"
    ></div>


    <!-- ============================================================
         SCRIPTS
    ============================================================ -->

    <script src="js/api.js"></script>

    <script src="js/navigation.js"></script>

    <script src="js/components/detail-header.js"></script>

    <script src="js/components/modal.js"></script>

    <script src="js/components/notifications.js"></script>

    <script src="js/issue-types.js"></script>

</body>

</html>
