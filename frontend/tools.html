
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tools</title>

    <!-- Base styles -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/tools.css"
    >

    <!-- Shared component styles -->
    <link
        rel="stylesheet"
        href="css/details/detail-header.css"
    >

    <link
        rel="stylesheet"
        href="css/details/modal.css"
    >

    <link
        rel="stylesheet"
        href="css/details/notifications.css"
    >

    <!-- List page styles -->
    <link
        rel="stylesheet"
        href="css/list-page.css"
    >
</head>

<body>

    <div id="appNavigation"></div>

    <div class="app-content">

        <main class="list-page-container">

            <!-- PAGE HEADER -->

            <div id="pageHeader"></div>


            <!-- ================================================= -->
            <!-- TOOLS LIST -->
            <!-- ================================================= -->

            <section class="list-page-section">

                <!-- TOOLBAR -->

                <div class="list-page-toolbar">

                    <div class="list-page-search">
                        <input
                            type="text"
                            id="searchInput"
                            placeholder="Search tools..."
                            aria-label="Search tools"
                        >
                    </div>

                    <button
                        type="button"
                        id="addToolButton"
                        class="list-page-create-button"
                    >
                        + New Tool
                    </button>

                </div>


                <!-- EMPTY STATE -->

                <div
                    id="toolsEmptyState"
                    class="list-page-empty-state list-page-hidden"
                >
                    <p class="list-page-empty-message">
                        There are no tools available yet.
                    </p>
                </div>


                <!-- TABLE -->

                <div class="list-page-table-container">

                    <table class="list-page-table">

                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="toolsTableBody">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <!-- ===================================================== -->
    <!-- TOOL MODAL -->
    <!-- ===================================================== -->

    <div
        id="toolModal"
        class="modal hidden"
    ></div>


    <!-- ===================================================== -->
    <!-- SCRIPTS -->
    <!-- ===================================================== -->

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>

    <!-- Shared components -->
    <script src="js/components/detail-header.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/notifications.js"></script>

    <!-- Page logic -->
    <script src="js/tools.js"></script>

</body>

</html>
