<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Knowledge Base Note Details</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/tools.css"
    >

</head>

<body>

<header>

    <h1>Ticket Creator</h1>

    <nav>

        <button id="ticketsButton">
            Tickets
        </button>

        <button id="toolsButton">
            Tools
        </button>

        <button id="locationsButton">
            Locations
        </button>

        <button id="queuesButton">
            Queues
        </button>

        <button id="wmsButton">
            WMS
        </button>

        <button id="formsButton">
            Forms
        </button>

        <button id="troubleshootingTemplatesButton">
            Troubleshooting Templates
        </button>

        <button id="knowledgeBaseButton">
            Knowledge Base
        </button>

        <button id="knowledgeBaseNotesButton">
            Knowledge Base Notes
        </button>

    </nav>

</header>


<main>

    <!-- =========================================================
         HEADER
         ========================================================= -->

    <div class="crud-header">

        <div>

            <h2 id="noteTitle">
                Knowledge Base Note
            </h2>

            <p id="noteCategory">
            </p>

        </div>

        <button id="backButton">
            Back
        </button>

    </div>


    <!-- =========================================================
         BASIC INFORMATION
         ========================================================= -->

    <section>

        <h3>
            Basic Information
        </h3>


        <div class="crud-table-container">

            <table class="crud-table">

                <tbody>

                    <tr>

                        <th>
                            ID
                        </th>

                        <td id="noteId">
                            -
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Title
                        </th>

                        <td id="noteTitleValue">
                            -
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Category
                        </th>

                        <td id="noteCategoryValue">
                            -
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Status
                        </th>

                        <td id="noteStatus">
                            -
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Pinned
                        </th>

                        <td id="notePinned">
                            -
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Created By
                        </th>

                        <td id="noteCreatedBy">
                            -
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Created At
                        </th>

                        <td id="noteCreatedAt">
                            -
                        </td>

                    </tr>


                    <tr>

                        <th>
                            Updated At
                        </th>

                        <td id="noteUpdatedAt">
                            -
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- =========================================================
         CONTENT
         ========================================================= -->

    <section>

        <h3>
            Content
        </h3>


        <div class="crud-table-container">

            <table class="crud-table">

                <tbody>

                    <tr>

                        <th>
                            Content
                        </th>

                        <td
                            id="noteContent"
                            style="white-space: pre-wrap;"
                        >
                            -
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- =========================================================
         TOOLS
         ========================================================= -->

    <section>

        <div class="crud-header">

            <h3>
                Tools
            </h3>

            <button id="addToolButton">
                Add Tool
            </button>

        </div>


        <p id="toolsEmptyMessage">
            No tools assigned.
        </p>


        <div class="crud-table-container">

            <table class="crud-table">

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="toolsTableBody">
                </tbody>

            </table>

        </div>

    </section>


    <!-- =========================================================
         ISSUE TYPES
         ========================================================= -->

    <section>

        <div class="crud-header">

            <h3>
                Issue Types
            </h3>

            <button id="addIssueTypeButton">
                Add Issue Type
            </button>

        </div>


        <p id="issueTypesEmptyMessage">
            No issue types assigned.
        </p>


        <div class="crud-table-container">

            <table class="crud-table">

                <thead>

                    <tr>

                        <th>
                            Name
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>

                <tbody id="issueTypesTableBody">
                </tbody>

            </table>

        </div>

    </section>

</main>


<!-- =========================================================
     TOOL MODAL
     ========================================================= -->

<div
    id="toolModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h3>
                Add Tool
            </h3>

            <button
                id="closeToolModalButton"
                class="modal-close"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label for="toolSelect">
                Tool
            </label>

            <select
                id="toolSelect"
                style="width: 100%; padding: 10px;"
            >

                <option value="">
                    Select a tool
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button id="cancelToolButton">
                Cancel
            </button>

            <button id="saveToolButton">
                Save
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     ISSUE TYPE MODAL
     ========================================================= -->

<div
    id="issueTypeModal"
    class="modal hidden"
>

    <div class="modal-content">

        <div class="modal-header">

            <h3>
                Add Issue Type
            </h3>

            <button
                id="closeIssueTypeModalButton"
                class="modal-close"
            >
                ×
            </button>

        </div>


        <div class="form-group">

            <label for="issueTypeSelect">
                Issue Type
            </label>

            <select
                id="issueTypeSelect"
                style="width: 100%; padding: 10px;"
            >

                <option value="">
                    Select an issue type
                </option>

            </select>

        </div>


        <div class="modal-actions">

            <button id="cancelIssueTypeButton">
                Cancel
            </button>

            <button id="saveIssueTypeButton">
                Save
            </button>

        </div>

    </div>

</div>


<script src="js/api.js"></script>

<script src="js/knowledge-base-note-detail.js"></script>

</body>

</html>
