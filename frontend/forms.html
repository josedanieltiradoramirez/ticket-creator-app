<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forms</title>

    <link
        rel="stylesheet"
        href="css/tools.css"
    >

</head>

<body>

    <header>

        <h1>Forms</h1>

        <button id="backButton">
            Back
        </button>

    </header>


    <main>

        <div class="crud-header">

            <h2>Forms</h2>

            <button id="addFormButton">
                New Form
            </button>

        </div>


        <div class="crud-toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search forms..."
            >

        </div>


        <div class="crud-table-container">

            <table class="crud-table">

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="formsTableBody">

                </tbody>

            </table>

        </div>

    </main>


    <!-- MODAL -->

    <div
        id="formModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    New Form
                </h2>

                <button
                    id="closeModalButton"
                    class="modal-close"
                >
                    ×
                </button>

            </div>


            <form id="formForm">


                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        required
                    ></textarea>

                </div>


                <div class="form-group checkbox-group">

                    <input
                        type="checkbox"
                        id="isActive"
                        checked
                    >

                    <label for="isActive">
                        Active
                    </label>

                </div>


                <div class="modal-actions">

                    <button
                        type="button"
                        id="cancelButton"
                    >
                        Cancel
                    </button>

                    <button type="submit">
                        Save
                    </button>

                </div>


            </form>

        </div>

    </div>


    <script src="js/api.js"></script>
    <script src="js/forms.js"></script>

</body>

</html>
