<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Creator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Ticket Creator</h1>

        <button id="logoutButton">
            Logout
        </button>
    </header>


    <!-- MAIN CONTENT -->
    <main>

        <h2>Tickets</h2>

        <!-- TICKETS -->
        <!-- FILTERS -->
    
        <section id="ticketsSection">

            <div id="filters">

                <label for="statusFilter">Status:</label>
                <select id="statusFilter">
                    <option value="">All</option>
                </select>

                <label for="issueTypeFilter">Issue Type:</label>
                <select id="issueTypeFilter">
                    <option value="">All</option>
                </select>

                <label for="priorityFilter">Priority:</label>
                <select id="priorityFilter">
                    <option value="">All</option>
                </select>

                <label for="queueFilter">Queue:</label>
                <select id="queueFilter">
                    <option value="">All</option>
                </select>

                <label for="toolFilter">Tool:</label>
                <select id="toolFilter">
                    <option value="">All</option>
                </select>

                <label for="locationFilter">Location:</label>
                <select id="locationFilter">
                    <option value="">All</option>
                </select>

                <label for="ticketNumberFilter">Ticket Number:</label>
                <input
                    type="text"
                    id="ticketNumberFilter"
                    placeholder="Search ticket..."
                >

                <label for="userNameFilter">User Name:</label>
                <input
                    type="text"
                    id="userNameFilter"
                    placeholder="Search user..."
                >

                <label for="ticketDateFilter">Date:</label>
                <input
                    type="date"
                    id="ticketDateFilter"
                >

                <button id="applyFilters">Aplicar filtros</button>
                <button id="clearFilters">Limpiar filtros</button>

            </div>

            <table id="ticketsTable">

                <thead>
                    <tr>
                        <th>Ticket number</th>
                        <th>Title</th>
                        <th>Issue type</th>
                        <th>Tool</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Queue</th>
                        <th>Location</th>
                    </tr>
                </thead>

                <tbody id="ticketsContainer">
                </tbody>

            </table>
            <div id="pagination">
                <button id="previousPage">Last</button>

                <span id="pageInfo"></span>

                <button id="nextPage">Next</button>
            </div>


        </section>

    </main>


    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
