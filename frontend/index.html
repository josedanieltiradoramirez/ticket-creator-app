
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tickets</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/details/detail-header.css">
    <link rel="stylesheet" href="css/list-page.css">
    <link rel="stylesheet" href="css/ticket-page.css">
</head>

<body>
    <div id="appNavigation"></div>

    <div class="app-content">
        <main class="list-page-container">

            <!-- Shared header, just like Tools -->
            <div id="pageHeader"></div>

            <section class="list-page-section" id="ticketsSection">

                <!-- Ticket actions -->
                <div class="list-page-toolbar">
                    <div class="tickets-toolbar-label">
                        All Tickets
                    </div>

                    <button
                        type="button"
                        id="newTicketButton"
                        class="list-page-create-button">
                        + New Ticket
                    </button>
                </div>

                <!-- Filters -->
                <div id="filters" class="tickets-filters">

                    <div class="tickets-filter-field">
                        <label for="ticketNumberFilter">Ticket number</label>
                        <input type="text" id="ticketNumberFilter"
                               placeholder="Search ticket...">
                    </div>

                    <div class="tickets-filter-field">
                        <label for="userNameFilter">User name</label>
                        <input type="text" id="userNameFilter"
                               placeholder="Search user...">
                    </div>

                    <div class="tickets-filter-field">
                        <label for="statusFilter">Status</label>
                        <select id="statusFilter">
                            <option value="">All</option>
                        </select>
                    </div>

                    <div class="tickets-filter-field">
                        <label for="issueTypeFilter">Issue type</label>
                        <select id="issueTypeFilter">
                            <option value="">All</option>
                        </select>
                    </div>

                    <div class="tickets-filter-field">
                        <label for="priorityFilter">Priority</label>
                        <select id="priorityFilter">
                            <option value="">All</option>
                        </select>
                    </div>

                    <div class="tickets-filter-field">
                        <label for="queueFilter">Queue</label>
                        <select id="queueFilter">
                            <option value="">All</option>
                        </select>
                    </div>

                    <div class="tickets-filter-field">
                        <label for="toolFilter">Tool</label>
                        <select id="toolFilter">
                            <option value="">All</option>
                        </select>
                    </div>

                    <div class="tickets-filter-field">
                        <label for="locationFilter">Location</label>
                        <select id="locationFilter">
                            <option value="">All</option>
                        </select>
                    </div>

                    <div class="tickets-filter-field">
                        <label for="ticketDateFilter">Created date</label>
                        <input type="date" id="ticketDateFilter">
                    </div>

                    <div class="tickets-filter-actions">
                        <button type="button" id="applyFilters"
                                class="tickets-filter-button-primary">
                            Apply filters
                        </button>

                        <button type="button" id="clearFilters"
                                class="tickets-filter-button-secondary">
                            Clear
                        </button>
                    </div>
                </div>

                <!-- Tickets table -->
                <div class="list-page-table-container">
                    <table id="ticketsTable" class="list-page-table tickets-table">
                        <thead>
                            <tr>
                                <th>Ticket number</th>
                                <th>Title</th>
                                <th>Issue type</th>
                                <th>Tool</th>
                                <th>Status</th>
                                <th>Priority</th>
                                <th>Queue</th>
                                <th>Location</th>
                                <th>Created at</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsContainer"></tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div id="pagination" class="tickets-pagination">
                    <span id="pageInfo">Page 1</span>

                    <div class="tickets-pagination-controls">
                        <button type="button" id="previousPage"
                                class="tickets-filter-button-secondary">
                            Previous
                        </button>

                        <button type="button" id="nextPage"
                                class="tickets-filter-button-secondary">
                            Next
                        </button>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/components/detail-header.js"></script>

    <script>
        renderDetailHeader({
            containerId: "pageHeader",
            type: "Workspace",
            title: "Tickets",
            description: "Review, filter, and manage support tickets.",
            actions: {
                back: false,
                edit: false
            }
        });
    </script>

    <script src="js/app.js"></script>
</body>
</html>
