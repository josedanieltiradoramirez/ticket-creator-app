<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket Creator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>Ticket Creator</h1>

        <button id="logoutButton">
            Logout
        </button>
    </header>


    <!-- MAIN CONTENT -->
    <main>

        <h2>Tickets</h2>


        <!-- FILTERS -->
        <section id="filters">

          

        </section>


        <!-- TICKETS -->
        <section id="ticketsSection">

            <div id="filters">

                <label for="statusFilter">Status:</label>

                <select id="statusFilter">
                    <option value="">All</option>
                </select>

                <button id="applyFilters">Apply filters</button>

            </div>

            <table id="ticketsTable">

                <thead>
                    <tr>
                        <th>Ticket number</th>
                        <th>Title</th>
                        <th>Issue type</th>
                        <th>Tool</th>
                        <th>Status</th>
                        <th>Priority</th>
                        <th>Queue</th>
                        <th>Location</th>
                    </tr>
                </thead>

                <tbody id="ticketsContainer">
                </tbody>

            </table>
            <div id="pagination">
                <button id="previousPage">Last</button>

                <span id="pageInfo"></span>

                <button id="nextPage">Next</button>
            </div>


        </section>

    </main>


    <script src="js/api.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
